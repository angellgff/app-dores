server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Compresión Gzip ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ─── Headers de seguridad ───────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Service Worker: sin caché ──────────────────────────────────────────
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # Scope del SW — importantísimo para PWA
        add_header Service-Worker-Allowed "/";
    }

    # ─── Manifest PWA: caché corta ──────────────────────────────────────────
    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600";
    }

    # ─── Assets estáticos: caché larga (immutable) ──────────────────────────
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ─── Imágenes y media ───────────────────────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ─── API proxy (si la app y la API están en el mismo dominio) ───────────
    # Descomentar si se necesita reverse proxy hacia el backend
    # location /api/ {
    #     proxy_pass https://dores.cruznegradev.com/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ─── SPA: todas las rutas → index.html ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
